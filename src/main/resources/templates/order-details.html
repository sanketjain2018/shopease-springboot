<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::section})}">

<section>

<style>
    .order-box {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .status-badge {
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: 600;
    }
    .product-img {
        width: 56px;
        height: 56px;
        object-fit: contain;
    }
    @media (max-width: 767px) {
        .text-end-sm {
            text-align: left !important;
        }
    }
</style>

<div class="container py-3">

    <div class="order-box">

        <!-- HEADER -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
            <h5 class="fw-bold mb-0">
                🧾 Order #<span th:text="${order.id}"></span>
            </h5>

            <!-- STATUS BADGE (NULL SAFE) -->
            <span th:if="${order.status == null}"
                  class="status-badge bg-secondary text-white">
                UNKNOWN
            </span>

            <span th:if="${order.status != null and order.status.toString() == 'PLACED'}"
                  class="status-badge bg-primary text-white">
                PLACED
            </span>

            <span th:if="${order.status != null and order.status.toString() == 'SHIPPED'}"
                  class="status-badge bg-warning text-dark">
                SHIPPED
            </span>

            <span th:if="${order.status != null and order.status.toString() == 'DELIVERED'}"
                  class="status-badge bg-success text-white">
                DELIVERED
            </span>

            <span th:if="${order.status != null and order.status.toString() == 'CANCELLED'}"
                  class="status-badge bg-danger text-white">
                CANCELLED
            </span>
        </div>

        <!-- DATE -->
        <p class="text-muted mb-3">
            <i class="bi bi-calendar"></i>
            <span th:text="${#temporals.format(order.orderDate,'dd MMM yyyy HH:mm')}"></span>
        </p>

        <!-- ITEMS -->
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th class="text-center">Price</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Total</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="item : ${order.items}">
                    <!-- PRODUCT -->
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img class="product-img"
                                 th:src="${item.product.imageUrl != null ? item.product.imageUrl : '/images/placeholder.png'}"
                                 alt="Product">
                            <span th:text="${item.product.name}">Product</span>
                        </div>
                    </td>

                    <!-- PRICE -->
                    <td class="text-center">
                        ₹<span th:text="${item.price}"></span>
                    </td>

                    <!-- QTY -->
                    <td class="text-center" th:text="${item.quantity}"></td>

                    <!-- LINE TOTAL -->
                    <td class="text-end fw-semibold">
                        ₹<span th:text="${item.price * item.quantity}"></span>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

        <!-- TOTAL SUMMARY -->
        <div class="d-flex justify-content-end mt-3">
            <div class="bg-light rounded p-3 text-end">
                <div class="fw-bold text-success fs-5">
                    Grand Total: ₹<span th:text="${order.totalAmount}"></span>
                </div>
            </div>
        </div>

    </div>

    <!-- ACTIONS -->
    <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">

        <form th:if="${order.status != null and order.status.toString() != 'CANCELLED'}"
              th:action="@{/user/orders/reorder/{id}(id=${order.id})}"
              method="post">
            <button class="btn btn-warning btn-sm">
                🔁 Reorder
            </button>
        </form>

        <a th:href="@{/user/orders}" class="btn btn-outline-secondary btn-sm">
            ← Back to My Orders
        </a>

    </div>

</div>

</section>
</html>
