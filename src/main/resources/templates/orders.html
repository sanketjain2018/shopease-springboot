<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::section})}">

<section>

<style>
    .order-card {
        background: #fff;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.06);
        font-size: 0.95rem;
    }

    .badge-id {
        background: #e7f1ff;
        color: #0d6efd;
    }

    .badge-amount {
        background: #e8fff3;
        color: #198754;
    }

    .badge-placed { background: #0d6efd; color: #fff; }
    .badge-shipped { background: #ffc107; color:#000; }
    .badge-delivered { background: #198754; color:#fff; }
    .badge-cancelled { background: #dc3545; color:#fff; }

    .timeline-icons i {
        font-size: 15px;
        margin-right: 8px;
        color: #adb5bd;
    }

    .timeline-icons .done {
        color: #198754;
    }

    @media (max-width: 767px) {
        .order-actions {
            text-align: left !important;
            margin-top: 8px;
        }
    }
</style>

<div class="container py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">📦 My Orders</h5>
        <a th:href="@{/shop}" class="btn btn-outline-primary btn-sm">
            Continue Shopping
        </a>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(orders)}"
         class="alert alert-info text-center py-4 rounded-3">
        <h6 class="fw-bold mb-2">You have not placed any orders yet.</h6>
        <p class="mb-2 text-muted">Start shopping to see your orders here.</p>
        <a th:href="@{/shop}" class="btn btn-sm btn-primary">
            Start Shopping
        </a>
    </div>

    <!-- ORDERS LIST -->
    <div th:each="order : ${orders}" class="order-card">

        <div class="row align-items-center g-2">

            <!-- ORDER ID -->
            <div class="col-md-2 col-6">
                <span class="badge badge-id">
                    ORDER #<span th:text="${order.id}"></span>
                </span>
            </div>

            <!-- DATE -->
            <div class="col-md-2 col-6 text-muted text-md-start text-end">
                <i class="bi bi-calendar"></i>
                <span th:text="${order.orderDate != null ? #temporals.format(order.orderDate,'dd MMM yyyy') : 'N/A'}"></span>
            </div>

            <!-- TIMELINE -->
            <div class="col-md-3 col-12 timeline-icons mt-2 mt-md-0">
                <i class="bi bi-bag-check done"></i>

                <i class="bi bi-truck"
                   th:classappend="${order.status != null and (order.status.name() == 'SHIPPED' or order.status.name() == 'DELIVERED')} ? ' done' : ''"></i>

                <i class="bi bi-house-check"
                   th:classappend="${order.status != null and order.status.name() == 'DELIVERED'} ? ' done' : ''"></i>
            </div>

            <!-- AMOUNT -->
            <div class="col-md-2 col-6 mt-2 mt-md-0">
                <span class="badge badge-amount">
                    ₹<span th:text="${order.totalAmount}"></span>
                </span>
            </div>

            <!-- STATUS BADGE -->
            <div class="col-md-1 col-6 mt-2 mt-md-0 text-md-start text-end">
                <span class="badge"
                      th:text="${order.status != null ? order.status.name() : 'UNKNOWN'}"
                      th:classappend="
                        ${order.status != null and order.status.name() == 'PLACED'} ? ' badge-placed' :
                        (${order.status != null and order.status.name() == 'SHIPPED'} ? ' badge-shipped' :
                        (${order.status != null and order.status.name() == 'DELIVERED'} ? ' badge-delivered' : ' badge-cancelled'))">
                </span>
            </div>

            <!-- ACTIONS -->
            <div class="col-md-2 col-12 order-actions text-end mt-2 mt-md-0">

                <a th:href="@{/user/orders/{id}(id=${order.id})}"
                   class="btn btn-outline-primary btn-sm me-1">
                    View
                </a>

                <form th:if="${order.status != null and order.status.name() == 'PLACED'}"
                      th:action="@{/user/orders/cancel/{id}(id=${order.id})}"
                      method="post"
                      class="d-inline">
                    <button class="btn btn-outline-danger btn-sm"
                            onclick="return confirm('Cancel this order?')">
                        Cancel
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

</section>
</html>
