<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
	th:replace="~{layout :: layout(~{::section})}">

<section>

	<!-- ================= PAGE HEADER ================= -->
	<div class="container mb-4">
		<div
			class="d-flex flex-wrap justify-content-between align-items-center gap-2">
			<div>
				<h2 class="fw-bold mb-1">Account Settings</h2>
				<p class="text-muted mb-0">Manage your personal information</p>
			</div>

			<div class="d-flex gap-2">
				<a th:href="@{/user/dashboard}"
					class="btn btn-outline-secondary btn-sm">← Dashboard</a> <a
					th:href="@{/}" class="btn btn-outline-dark btn-sm">🏠 Home</a> <a
					th:href="@{/shop}" class="btn btn-outline-primary btn-sm">🛍️
					Shop</a>
			</div>
		</div>
	</div>

	<div class="container">
		<div class="row g-4 justify-content-center">

			<!-- ================= LEFT : PROFILE IMAGE ================= -->
			<div class="col-lg-4">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">

						<h5 class="fw-bold mb-3">Profile Photo</h5>

						<img
							th:src="${user.profileImageUrl != null ? user.profileImageUrl : '/images/avatar.png'}"
							class="rounded-circle mb-3"
							style="width: 120px; height: 120px; object-fit: cover;"
							alt="Profile Image">

						<p class="text-muted small">Upload a new profile picture while
							saving your profile.</p>

					</div>
				</div>
			</div>

			<!-- ================= RIGHT : PROFILE FORM ================= -->
			<div class="col-lg-8">

				<!-- SUCCESS MESSAGE -->
				<div th:if="${param.success}" class="alert alert-success">✅
					Profile updated successfully</div>

				<div class="card shadow-sm border-0">
					<div class="card-body p-4">

						<h5 class="fw-bold mb-4">Personal Information</h5>

						<form th:action="@{/user/profile}" method="post"
							enctype="multipart/form-data">

							<div class="row g-3">

								<!-- USERNAME (READ ONLY) -->
								<div class="col-md-6">
									<label class="form-label fw-semibold">Username</label> <input
										type="text" class="form-control" th:value="${user.username}"
										disabled>
								</div>

								<!-- FULL NAME -->
								<div class="col-md-6">
									<label class="form-label fw-semibold">Full Name</label> <input
										type="text" name="name" class="form-control"
										th:value="${user.name}" required>
								</div>

								<!-- ADDRESS -->
								<div class="col-md-12">
									<label class="form-label fw-semibold">Address</label> <input
										type="text" name="addressLine1" class="form-control"
										th:value="${user.addressLine1}">
								</div>

								<!-- CITY -->
								<div class="col-md-4">
									<label class="form-label fw-semibold">City</label> <input
										type="text" name="city" class="form-control"
										th:value="${user.city}">
								</div>

								<!-- STATE -->
								<div class="col-md-4">
									<label class="form-label fw-semibold">State</label> <input
										type="text" name="state" class="form-control"
										th:value="${user.state}">
								</div>

								<!-- PINCODE -->
								<div class="col-md-4">
									<label class="form-label fw-semibold">Pincode</label> <input
										type="text" name="pincode" class="form-control"
										th:value="${user.pincode}">
								</div>

								<!-- PROFILE IMAGE -->
								<div class="col-md-12">
									<label class="form-label fw-semibold">Profile Image</label> <input
										type="file" name="image" class="form-control" accept="image/*">
								</div>

							</div>

							<!-- ACTIONS -->
							<div class="d-flex justify-content-end gap-2 mt-4">
								<a th:href="@{/user/dashboard}"
									class="btn btn-outline-secondary"> Cancel </a>

								<button class="btn btn-success px-4">Save Changes</button>
							</div>

						</form>

					</div>
				</div>

			</div>

		</div>
	</div>

</section>
</html>
