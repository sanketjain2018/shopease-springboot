<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">

                <div class="card border-0 shadow-sm p-4 p-md-5 text-center">

                    <!-- SUCCESS ICON -->
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success"
                           style="font-size: 4rem;"></i>
                    </div>

                    <h2 class="fw-bold mb-2">
                        Order Placed Successfully 🎉
                    </h2>

                    <p class="text-muted mb-4">
                        Thank you for your purchase. Your order has been placed and your cart is now empty.
                    </p>

                    <!-- ORDER INFO (OPTIONAL, DYNAMIC) -->
                    <div class="bg-light rounded p-3 mb-4" 
                         th:if="${orderId != null or total != null}">

                        <div class="d-flex justify-content-between"
                             th:if="${orderId != null}">
                            <span class="text-muted">Order ID</span>
                            <strong th:text="${orderId}">#12345</strong>
                        </div>

                        <div class="d-flex justify-content-between mt-2"
                             th:if="${total != null}">
                            <span class="text-muted">Total Paid</span>
                            <strong class="text-success">
                                ₹ <span th:text="${total}">0</span>
                            </strong>
                        </div>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">

                        <a th:href="@{/user/orders}"
                           class="btn btn-success px-4">
                            📦 View My Orders
                        </a>

                        <a th:href="@{/shop}"
                           class="btn btn-outline-secondary px-4">
                            🛍 Continue Shopping
                        </a>

                        <a th:href="@{/}"
                           class="btn btn-outline-dark px-4">
                            🏠 Home
                        </a>

                    </div>

                </div>

            </div>
        </div>
    </div>

</section>
</html>
