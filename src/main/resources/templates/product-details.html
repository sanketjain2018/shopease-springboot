<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: layout(~{::section})}">
<section>

	<div class="container my-5">
		<div class="row g-4">

			<!-- IMAGE -->
			<div class="col-md-5 text-center">
				<img class="img-fluid"
					th:src="${product.imageUrl != null ? product.imageUrl : '/images/placeholder.png'}"
					alt="Product">
			</div>

			<!-- DETAILS -->
			<div class="col-md-7">
				<h2 class="fw-bold" th:text="${product.name}">Product Name</h2>

				<p class="fs-4 text-success">
					₹ <span th:text="${product.price}">0</span>
				</p>

				<p>
					Category: <span th:text="${product.category}">N/A</span>
				</p>

				<p>
					Stock: <span th:text="${product.stock}">0</span>
				</p>

				<form th:action="@{/user/cart/add/{id}(id=${product.id})}"
					method="post">
					<button class="btn btn-success" th:disabled="${product.stock == 0}">
						Add to Cart</button>

					<div class="mt-3 d-flex gap-2">
						<a th:href="@{/shop}" class="btn btn-outline-secondary"> ←
							Back to Shop </a> <a th:href="@{/}" class="btn btn-outline-primary">
							🏠 Home </a>
					</div>

				</form>
			</div>

		</div>
	</div>

</section>
</html>
