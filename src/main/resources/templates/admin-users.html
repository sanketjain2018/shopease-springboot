<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::section})}">

<section>

    <!-- ================= PAGE HEADER ================= -->
    <div class="page-header text-center">
        <div class="container">
            <h1 class="fw-bold">👥 User Management</h1>
            <p class="lead">
                View, manage roles and control user access
            </p>
        </div>
    </div>

    <!-- ================= CONTENT ================= -->
    <div class="container my-5">

        <!-- HEADER ACTION -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h4 class="fw-bold mb-0">Users List</h4>

            <div class="d-flex gap-2">
                <input type="text"
                       id="userSearch"
                       class="form-control form-control-sm"
                       placeholder="🔍 Search user..."
                       onkeyup="filterUsers()">

                <a th:href="@{/admin/dashboard}"
                   class="btn btn-outline-secondary btn-sm">
                    ← Dashboard
                </a>
            </div>
        </div>

        <!-- USERS CARD -->
        <div class="card shadow-sm border-0">

            <div class="card-header bg-white fw-bold">
                Registered Users
            </div>

            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="usersTable">

                        <thead class="table-light">
                        <tr>
                            <th style="width: 80px;">#</th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="user : ${users}">

                            <!-- ID -->
                            <td th:text="${user.id}"></td>

                            <!-- USER (Avatar + Name) -->
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                                         style="width: 40px; height: 40px; font-weight: bold;"
                                         th:text="${#strings.substring(user.username,0,1).toUpperCase()}">
                                    </div>
                                    <div>
                                        <div class="fw-semibold username"
                                             th:text="${user.username}">
                                            username
                                        </div>
                                        <div class="text-muted small">
                                            ID: <span th:text="${user.id}"></span>
                                        </div>
                                    </div>
                                </div>
                            </td>

                            <!-- EMAIL -->
                            <td th:text="${user.email}"></td>

                            <!-- ROLE -->
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      th:text="${user.role}">
                                </span>
                            </td>

                            <!-- STATUS -->
                            <td>
                                <span th:if="${user.enabled}"
                                      class="badge bg-success">
                                    ACTIVE
                                </span>
                                <span th:unless="${user.enabled}"
                                      class="badge bg-secondary">
                                    DISABLED
                                </span>
                            </td>

                            <!-- ACTIONS -->
                            <td class="text-center">

                                <div class="d-inline-flex gap-2">

                                    <form th:action="@{/admin/users/change-role/{id}(id=${user.id})}"
                                          method="post"
                                          class="d-inline">
                                        <button class="btn btn-sm btn-outline-warning"
                                                title="Change Role">
                                            <i class="bi bi-shield-lock"></i>
                                        </button>
                                    </form>

                                    <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}"
                                          method="post"
                                          class="d-inline">
                                        <button class="btn btn-sm btn-outline-secondary"
                                                title="Enable / Disable">
                                            <i class="bi bi-power"></i>
                                        </button>
                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-people fs-3 d-block mb-2"></i>
                                No users found
                            </td>
                        </tr>

                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </div>

    <!-- ================= SIMPLE CLIENT-SIDE SEARCH ================= -->
    <script>
        function filterUsers() {
            const input = document.getElementById("userSearch");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("usersTable");
            const rows = table.getElementsByTagName("tr");

            for (let i = 1; i < rows.length; i++) {
                const usernameCell = rows[i].querySelector(".username");
                if (!usernameCell) continue;

                const txtValue = usernameCell.textContent || usernameCell.innerText;
                rows[i].style.display = txtValue.toLowerCase().includes(filter) ? "" : "none";
            }
        }
    </script>

</section>
</html>
